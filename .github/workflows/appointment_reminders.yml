name: Appointment Reminders

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  check-appointments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Create Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "Secret length: ${#FIREBASE_SERVICE_ACCOUNT}"

          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERROR: Secret is empty or unavailable"
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > service-account.json

          echo "File exists:"
          ls -l service-account.json

      - name: Validate Firebase credentials
        run: |
          python -c "import json; json.load(open('service-account.json')); print('Firebase credentials JSON is valid')"

      - name: Check appointments
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json
        run: |
          python scripts/appointment_reminders.py

      - name: Delete credentials
        if: always()
        run: |
          rm -f service-account.json